[project]
name = "home-assistant-automation-bridge"
version = "0.1.9"
description = "Dynamic Home Assistant entities for an external automation runtime"
requires-python = "==3.14.7.*"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant==2026.8.3",
    "pyrefly>=0.35.0",
    "pytest-homeassistant-custom-component>=0.13.300",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pyyaml>=6.0.2",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/wuast_automation_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN001", "ANN201", "ANN401", "ARG001", "ARG002", "COM812", "CPY001",
    "D", "EM101", "EM102", "FBT001", "ISC001", "PLC0415", "TC001", "TC002",
    "TC003", "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T201"]

[tool.pyrefly]
project-includes = ["custom_components"]
project-excludes = [".venv", "tests"]
