name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14.7
      - run: uv sync --frozen
      - name: Verify version
        run: |
          test "v$(jq -r .version custom_components/wuast_automation_bridge/manifest.json)" = "$GITHUB_REF_NAME"
      - name: Validate
        run: |
          .venv/bin/ruff check .
          .venv/bin/pyrefly check custom_components/wuast_automation_bridge
          .venv/bin/pytest
          .venv/bin/python scripts/generate_docs.py --check
      - name: Build HACS archive
        run: |
          cd custom_components/wuast_automation_bridge
          zip -9 -r ../../../wuast_automation_bridge.zip .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          wuast_automation_bridge.zip
          docs/API.md
          docs/entity-definition.schema.json
          --generate-notes
          --verify-tag
