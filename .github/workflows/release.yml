name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: uv python install 3.14.7
      - run: uv sync --frozen
      - name: Verify version
        run: |
          test "v$(jq -r .version custom_components/wuast_automation_bridge/manifest.json)" = "$GITHUB_REF_NAME"
      - name: Validate
        run: |
          .venv/bin/ruff check .
          .venv/bin/pyrefly check custom_components/wuast_automation_bridge
          .venv/bin/pytest
          .venv/bin/python scripts/generate_docs.py --check
      - name: Build HACS archive
        run: |
          cd custom_components/wuast_automation_bridge
          zip -9 -r ../../wuast_automation_bridge.zip .
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            wuast_automation_bridge.zip
            docs/API.md
            docs/entity-definition.schema.json
